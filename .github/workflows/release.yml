name: PoC - Command Injection Test

on:
  release:
    types: [published]

jobs:
  poc-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vulnerable Command - tag_name injected without sanitization
        env:
          FAKE_SECRET: "THIS_IS_A_SIMULATED_SECRET_VALUE"
        run: |
          echo "Executing: ./mvnw versions:set -DnewVersion=${{ github.event.release.tag_name }}"
          echo "If tag_name contains shell metacharacters, arbitrary commands execute here"
          echo "Secrets like FAKE_SECRET=$FAKE_SECRET would be exfiltrated"
