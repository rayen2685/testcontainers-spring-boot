name: PoC - Workflow Dispatch Injection Test

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
        type: string

jobs:
  poc-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vulnerable Command
        env:
          FAKE_SECRET: "SIMULATED_GPG_KEY_12345"
          FAKE_PASSWORD: "SIMULATED_OSSRH_PASS_67890"
        run: |
          echo "[VULNERABLE] Running: mvnw versions:set -DnewVersion=${{ github.event.inputs.version }}"
          echo "[INFO] If version contains shell metacharacters, commands execute here"
